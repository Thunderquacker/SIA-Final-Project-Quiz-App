spring:
  application:
    name: minu-backend
  datasource:
    url: jdbc:h2:file:./data/minudb;AUTO_SERVER=true
    driver-class-name: org.h2.Driver
    username: SA
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.minu: DEBUG