spring:
  application:
    name: minu-backend
  datasource:
    url: jdbc:h2:file:./data/minudb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop 
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

server:
  port: 8082
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.minu: DEBUG

# JWT Configuration
jwt:
  secret: minu-secret-key-for-jwt-token-generation-and-verification-production-safe-64-chars-minimum-required-for-hs512-algorithm-security!
  expiration: 86400000
